<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Download 示例</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 440px; padding: 32px; }
        .card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .card p.sub { color: #666; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #333; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: border-color .2s; }
        .form-group input:focus { outline: none; border-color: #4f6ef7; box-shadow: 0 0 0 3px rgba(79,110,247,0.12); }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }
        .form-row .form-group:last-child { flex: 0 0 auto; }
        .btn { padding: 11px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s, opacity .2s; }
        .btn-block { width: 100%; }
        .btn-primary { background: #4f6ef7; color: #fff; }
        .btn-primary:hover { background: #3d5bd9; }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sm { padding: 10px 16px; font-size: 13px; white-space: nowrap; }
        .btn-outline { background: #fff; color: #666; border: 1px solid #ddd; }
        .btn-outline:hover { background: #f5f5f5; }
        .message { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
        .message.error { display: block; background: #fde8e8; color: #c0392b; border: 1px solid #f5c6c6; }
        .message.success { display: block; background: #e8f8e8; color: #27ae60; border: 1px solid #c6f5c6; }
        .message.info { display: block; background: #e8f0fe; color: #2c6fdb; border: 1px solid #c6d9f5; }
        .info-box { background: #f8f9fa; border: 1px solid #eee; border-radius: 8px; padding: 12px; font-size: 13px; margin-bottom: 16px; }
        .info-box label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
        .info-box code { color: #333; word-break: break-all; }
        .footer { margin-top: 20px; text-align: center; font-size: 12px; color: #aaa; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .step { display: none; }
        .step.active { display: block; }
        .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nova Download</h1>
        <p class="sub">文章下载示例 · /nova-json/v1/posts</p>

        <div id="message" class="message"></div>

        <!-- Step 1: 文章 ID + 验证码 + 密码 -->
        <div id="step1" class="step active">
            <div class="form-group">
                <label for="postId">文章 ID</label>
                <input type="number" id="postId" placeholder="输入要下载的文章 ID" min="1">
            </div>
            <button class="btn btn-primary btn-block" id="btnSendCode" onclick="handleSendCode()" style="margin-bottom:16px;">发送邮箱验证码</button>
            <hr class="divider">
            <div class="form-group">
                <label for="code">邮箱验证码</label>
                <input type="text" id="code" placeholder="6 位数字验证码" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
            </div>
            <div class="form-group">
                <label for="password">操作密码</label>
                <input type="password" id="password" placeholder="config/markdown_copy_password.config 中的密码">
            </div>
            <button class="btn btn-primary btn-block" id="btnDownload" onclick="handleDownload()">下载文章</button>
        </div>

        <!-- Step 2: 下载中 / 已跳转 -->
        <div id="step2" class="step">
            <div class="info-box" id="downloadInfo">
                <label>跳转链接</label>
                <code id="redirectUrl"></code>
            </div>
            <p style="font-size:14px;color:#666;text-align:center;margin-bottom:16px;">
                正在跳转到下载页面...
            </p>
            <button class="btn btn-primary btn-block" id="btnOpen" onclick="openDownload()">手动打开下载页</button>
            <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="backToStep1()">返回</button>
        </div>

        <div class="footer">Nova JSON API Demo</div>
    </div>

    <script>
        // ---------- 状态 ----------
        let currentPostId = 0;
        const API_BASE = '/nova-json/v1/posts';

        // ---------- UI 工具 ----------
        function showMsg(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }
        function hideMsg() {
            document.getElementById('message').className = 'message';
        }
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.innerHTML = loading ? '<span class="spinner"></span>处理中...' : btn.dataset.text;
        }
        function goStep(n) {
            document.querySelectorAll('.step').forEach(function(el) { el.classList.remove('active'); });
            document.getElementById('step' + n).classList.add('active');
            hideMsg();
        }

        // ---------- 发送验证码 ----------
        async function handleSendCode() {
            const postId = document.getElementById('postId').value.trim();

            if (!postId) {
                showMsg('请输入文章 ID', 'error');
                return;
            }

            currentPostId = parseInt(postId);
            hideMsg();
            setLoading('btnSendCode', true);

            try {
                const res = await fetch(API_BASE + '/' + currentPostId + '/download/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await res.json();

                if (data.code === 'rest_ok') {
                    showMsg(data.message, 'success');
                    // 倒计时
                    let seconds = 60;
                    const btn = document.getElementById('btnSendCode');
                    btn.dataset.text = '发送验证码';
                    btn.innerHTML = seconds + 's后重试';
                    const timer = setInterval(function() {
                        seconds--;
                        btn.innerHTML = seconds + 's后重试';
                        if (seconds <= 0) {
                            clearInterval(timer);
                            btn.disabled = false;
                            btn.innerHTML = btn.dataset.text;
                        }
                    }, 1000);
                } else {
                    showMsg(data.message || '发送失败', 'error');
                    setLoading('btnSendCode', false);
                }
            } catch (err) {
                showMsg('网络错误: ' + err.message, 'error');
                setLoading('btnSendCode', false);
            }
        }

        // ---------- 下载文章 ----------
        function handleDownload() {
            const postId   = document.getElementById('postId').value.trim();
            const code     = document.getElementById('code').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!postId) {
                showMsg('请输入文章 ID', 'error');
                return;
            }
            if (!code || code.length !== 6) {
                showMsg('请输入 6 位验证码', 'error');
                return;
            }
            if (!password) {
                showMsg('请输入操作密码', 'error');
                return;
            }

            currentPostId = parseInt(postId);

            // 构造跳转 URL
            var protocol = window.location.protocol === 'https:' ? 'https' : 'http';
            var host = window.location.host;
            var redirectUrl = protocol + '://' + host
                + '/vendor/download_article_zip.php'
                + '?id=' + encodeURIComponent(currentPostId)
                + '&password=' + encodeURIComponent(password)
                + '&code=' + encodeURIComponent(code);

            document.getElementById('redirectUrl').textContent = redirectUrl;
            goStep(2);

            // 自动跳转
            window.location.href = redirectUrl;
        }

        function openDownload() {
            var url = document.getElementById('redirectUrl').textContent;
            if (url) window.open(url, '_blank');
        }

        function backToStep1() {
            goStep(1);
        }

        // ---------- 初始化 ----------
        (function init() {
            document.querySelectorAll('.btn').forEach(function(b) {
                b.dataset.text = b.innerHTML;
            });

            document.getElementById('code').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleDownload();
            });
            document.getElementById('password').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleDownload();
            });
        })();
    </script>
</body>
</html>
