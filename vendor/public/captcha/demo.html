<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行为验证码 — 集成示例</title>
    <!-- WASM SHA-256 加速库（可选，没有会降级为纯JS） -->
    <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4/dist/sha256.umd.min.js"></script>
    <!-- CryptoJS（AES 加密/解密，必选） -->
    <script src="crypto-js.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        h1 { font-size: 20px; color: #333; margin-bottom: 24px; font-weight: 500; }
        .demo-card {
            background: #fff; border-radius: 12px; padding: 36px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: 380px; max-width: 90vw;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 13px; color: #666; margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #4a90d9; }
        .captcha-wrap { margin-bottom: 16px; }
        .captcha-wrap > div { margin: 0 auto; }
        .submit-btn {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            background: #4a90d9; color: #fff; font-size: 15px; cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background: #3a7bc8; }
        .submit-btn:disabled { background: #a0c4eb; cursor: not-allowed; }
        .result {
            margin-top: 16px; padding: 12px 16px; border-radius: 6px;
            font-size: 13px; min-height: 40px; word-break: break-all;
            background: #f6f8fa; color: #999;
        }
        .result.success { background: #e8f5e9; color: #28a745; }
        .result.fail { background: #fce4ec; color: #dc3545; }
        .result .token-label { font-weight: bold; display: block; margin-bottom: 4px; }
        .result .token-value {
            font-family: 'SF Mono', Consolas, monospace; font-size: 12px; opacity: 0.85;
        }
        .tips {
            margin-top: 16px; padding: 10px 14px; background: #fffbe6;
            border: 1px solid #ffe58f; border-radius: 6px; font-size: 12px; color: #ad6800;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>行为验证码 — 集成示例</h1>
    <div class="demo-card">
        <!-- 模拟登录表单 -->
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" value="admin" autocomplete="off">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" value="123456" autocomplete="off">
        </div>

        <!-- 验证码容器 -->
        <div class="captcha-wrap">
            <div id="auth-container"></div>
        </div>

        <!-- 提交按钮（验证通过后自动激活） -->
        <button class="submit-btn" id="submit-btn" disabled>请先完成验证</button>

        <!-- 结果展示 -->
        <div class="result" id="result">等待验证...</div>

        <div class="tips">
            提交时将 bizToken 发送到服务端，服务端调用 AuthApi.php 验证令牌有效性后再执行业务逻辑。
        </div>
    </div>

    <script src="BehaviorAuth.js"></script>
    <script>
        const submitBtn = document.getElementById('submit-btn');
        const resultEl = document.getElementById('result');
        let bizToken = null;

        // 初始化验证码
        const auth = new BehaviorAuth('auth-container', 'AuthApi.php');

        // 验证成功：激活提交按钮
        auth.onSuccess = function(token) {
            bizToken = token;
            submitBtn.disabled = false;
            submitBtn.innerText = '提交登录';
            resultEl.className = 'result success';
            resultEl.innerHTML =
                '<span class="token-label">验证通过，bizToken:</span>' +
                '<span class="token-value">' + token + '</span>';
        };

        // 验证失败
        auth.onFail = function(msg) {
            bizToken = null;
            submitBtn.disabled = true;
            submitBtn.innerText = '请先完成验证';
            resultEl.className = 'result fail';
            resultEl.innerText = '验证失败: ' + msg;
        };

        // 模拟表单提交
        submitBtn.addEventListener('click', function() {
            if (!bizToken) return;

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                bizToken: bizToken,  // 把 bizToken 一起提交给服务端验证
            };

            resultEl.className = 'result';
            resultEl.innerText = '提交中...';

            // 模拟服务端响应（实际项目中用 fetch POST 到你的 API）
            setTimeout(() => {
                resultEl.className = 'result success';
                resultEl.innerHTML =
                    '<span class="token-label">登录成功</span>' +
                    '<span class="token-value">服务端已验证 bizToken，用户: ' + payload.username + '</span>';
            }, 800);
        });
    </script>
</body>
</html>
