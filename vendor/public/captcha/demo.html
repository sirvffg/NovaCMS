<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行为验证码示例</title>
    <!-- WASM SHA-256 加速库（可选，没有会降级为纯JS） -->
    <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4/dist/sha256.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        h1 { font-size: 20px; color: #333; margin-bottom: 30px; font-weight: 500; }
        .demo-card {
            background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .result {
            margin-top: 20px; padding: 12px 16px; background: #f6f8fa; border-radius: 6px;
            font-size: 13px; color: #666; min-height: 40px; word-break: break-all;
        }
        .result.success { background: #e8f5e9; color: #28a745; }
        .result.fail { background: #fce4ec; color: #dc3545; }
    </style>
</head>
<body>
    <h1>行为验证码示例</h1>
    <div class="demo-card">
        <div id="auth-container"></div>
        <div class="result" id="result">等待验证...</div>
    </div>

    <script src="BehaviorAuth.js"></script>
    <script>
        const auth = new BehaviorAuth('auth-container', 'AuthApi.php');

        // 验证成功回调
        auth.onSuccess = function(bizToken) {
            document.getElementById('result').className = 'result success';
            document.getElementById('result').innerText = '验证成功！业务令牌: ' + bizToken;
        };

        // 验证失败回调
        auth.onFail = function(msg) {
            document.getElementById('result').className = 'result fail';
            document.getElementById('result').innerText = '验证失败: ' + msg;
        };
    </script>
</body>
</html>
