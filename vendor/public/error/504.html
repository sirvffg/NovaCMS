<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>504 Gateway Timeout | Cloudflare</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #fff; color: #1d1d1d; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .cf-wrapper { max-width: 1000px; margin: 0 auto; padding: 40px 20px; flex: 1; width: 100%; box-sizing: border-box; }
        .cf-header { margin-bottom: 40px; }
        .cf-error-title { font-size: 3rem; font-weight: 600; margin: 0 0 10px 0; color: #1d1d1d; display: flex; align-items: center; gap: 12px; }
        .cf-error-title .error-text { font-weight: 400; }
        .cf-error-title .error-code { font-weight: 600; }
        .cf-ray-id { font-size: 1.2rem; color: #595959; margin-bottom: 20px; font-family: monaco, courier, monospace; }
        .cf-error-desc { font-size: 2.2rem; font-weight: 600; margin: 0; color: #1d1d1d; }
        .cf-section { margin-bottom: 40px; }
        .cf-columns { display: flex; gap: 40px; flex-wrap: wrap; }
        .cf-column { flex: 1; min-width: 300px; }
        .cf-section h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 15px; color: #1d1d1d; }
        .cf-section p { font-size: 1.1rem; line-height: 1.6; color: #595959; margin-top: 0; }
        .cf-footer { border-top: 1px solid #d9d9d9; padding: 20px; font-size: 0.9rem; color: #595959; }
        .cf-footer-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .cf-footer a { color: #0051c3; text-decoration: none; }
        .cf-footer a:hover { text-decoration: underline; }
        .cf-footer-item { display: inline-block; margin-right: 15px; }
        @media (max-width: 768px) { .cf-error-title { font-size: 2.5rem; } .cf-error-desc { font-size: 1.8rem; } }
    </style>
</head>
<body>
    <div class="cf-wrapper">
        <div class="cf-header">
            <h1 class="cf-error-title"><span class="error-text">Error</span><span class="error-code">504</span></h1>
            <div class="cf-ray-id">Ray ID: <span id="ray-id"></span> &bull; <span id="time"></span></div>
            <h2 class="cf-error-desc">Gateway Timeout</h2>
        </div>
        <div class="cf-section">
            <div class="cf-columns">
                <div class="cf-column">
                    <h2>What happened?</h2>
                    <p>The web server is not responding.</p>
                </div>
                <div class="cf-column">
                    <h2>What can I do?</h2>
                    <p>Please try again in a few minutes.</p>
                </div>
            </div>
        </div>
    </div>
    <div class="cf-footer">
        <div class="cf-footer-content">
            <div>
                <span class="cf-footer-item">Cloudflare Ray ID: <strong id="footer-ray-id"></strong></span>
                <span class="cf-footer-item">&bull;</span>
                <span class="cf-footer-item">Your IP: <span id="ip-address" style="cursor:pointer;text-decoration:underline;">Click to reveal</span></span>
            </div>
            <div>
                <span class="cf-footer-item">Performance &amp; security by <a href="https://www.cloudflare.com" target="_blank">Cloudflare</a></span>
            </div>
        </div>
    </div>
    <script>
        function generateRayId() { const chars = '0123456789abcdef'; let rayId = ''; for (let i = 0; i < 16; i++) { rayId += chars[Math.floor(Math.random() * chars.length)]; } return rayId; }
        const rayId = generateRayId(); document.getElementById('ray-id').textContent = rayId; document.getElementById('footer-ray-id').textContent = rayId;
        document.getElementById('time').textContent = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
        document.getElementById('ip-address').addEventListener('click', function() {
            fetch('https://api.ipify.org?format=json').then(response => response.json()).then(data => { this.textContent = data.ip; this.style.textDecoration='none'; this.style.cursor='default'; }).catch(() => { this.textContent = 'Unknown'; });
        }, { once: true });
    </script>
</body>
</html>
