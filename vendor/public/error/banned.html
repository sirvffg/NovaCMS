<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title" data-zh="访问被拒绝 | IP 已被封禁" data-en="Access Denied | IP Banned">访问被拒绝 | IP 已被封禁</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #fff; color: #1d1d1d; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .cf-wrapper { max-width: 1000px; margin: 0 auto; padding: 40px 20px; flex: 1; width: 100%; box-sizing: border-box; }
        .cf-header { margin-bottom: 40px; position: relative; }
        
        /* 语言切换按钮样式 */
        .lang-switch { position: absolute; top: 0; right: 0; padding: 8px 16px; cursor: pointer; background: #f0f0f0; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 0.9rem; transition: background 0.2s; }
        .lang-switch:hover { background: #e0e0e0; }

        .cf-error-title { font-size: 3rem; font-weight: 600; margin: 0 0 10px 0; color: #1d1d1d; display: flex; align-items: center; gap: 12px; }
        .cf-ray-id { font-size: 1.2rem; color: #595959; margin-bottom: 20px; font-family: monaco, courier, monospace; }
        .cf-error-desc { font-size: 2.2rem; font-weight: 600; margin: 0; color: #dc3545; }
        .cf-section { margin-bottom: 40px; }
        .cf-columns { display: flex; gap: 40px; flex-wrap: wrap; }
        .cf-column { flex: 1; min-width: 300px; }
        .cf-section h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 15px; color: #1d1d1d; }
        .cf-section p { font-size: 1.1rem; line-height: 1.6; color: #595959; margin-top: 0; white-space: pre-line; }
        .cf-footer { border-top: 1px solid #d9d9d9; padding: 20px; font-size: 0.9rem; color: #595959; }
        .cf-footer-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        @media (max-width: 768px) { .cf-error-title { font-size: 2.5rem; } .cf-error-desc { font-size: 1.8rem; } .lang-switch { position: static; margin-bottom: 20px; display: inline-block; } }
    </style>
</head>
<body>
    <div class="cf-wrapper">
        <div class="cf-header">
            <button class="lang-switch" onclick="toggleLanguage()" id="lang-btn">English</button>
            <h1 class="cf-error-title"><span class="error-text">Error</span><span class="error-code">403</span></h1>
            <div class="cf-ray-id">
                <span data-zh="封禁时间：" data-en="Ban Time: ">封禁时间：</span>
                <span id="ban-time"></span>
            </div>
            <h2 class="cf-error-desc" data-zh="&#128274; 您的 IP 已被封禁" data-en="&#128274; Your IP has been banned">&#128274; 您的 IP 已被封禁</h2>
        </div>
        <div class="cf-section">
            <div class="cf-columns">
                <div class="cf-column">
                    <h2 data-zh="发生了什么？" data-en="What happened?">发生了什么？</h2>
                    <p data-zh="您的 IP 地址已被列入黑名单，无法访问本站任何功能，包括注册、登录、评论、留言等操作。如有疑问，请联系网站管理员。" 
                       data-en="Your IP address has been blacklisted. You cannot access any features of this site, including registration, login, commenting, or messaging. If you have any questions, please contact the administrator.">
                       您的 IP 地址已被列入黑名单，无法访问本站任何功能，包括注册、登录、评论、留言等操作。如有疑问，请联系网站管理员。
                    </p>
                </div>
                <div class="cf-column">
                    <h2 data-zh="您可以做什么？" data-en="What can you do?">您可以做什么？</h2>
                    <p data-zh="1. 如果您认为这是误封，可以提交申诉。&#10;2. 封禁通常有有效期，到期后将自动解除。&#10;3. 请勿尝试使用代理等方式绕过封禁，否则可能导致永久封禁。" 
                       data-en="1. If you believe this is a mistake, you can submit an appeal.&#10;2. Bans usually have an expiration date and will be lifted automatically.&#10;3. Do not attempt to bypass the ban using proxies, as this may lead to a permanent ban.">
                       1. 如果您认为这是误封，可以<a href="/vendor/appeal.php?type=ip" style="color:#4361ee;font-weight:600;">提交申诉</a>。<br>2. 封禁通常有有效期，到期后将自动解除。<br>3. 请勿尝试使用代理等方式绕过封禁，否则可能导致永久封禁。
                    </p>
                </div>
            </div>
        </div>
    </div>
    <div class="cf-footer">
        <div class="cf-footer-content">
            <div>
                <span class="cf-footer-item">
                    <span data-zh="您的 IP：" data-en="Your IP: ">您的 IP：</span>
                    <strong id="ip-address">Loading...</strong>
                </span>
            </div>
            <div>
                <span class="cf-footer-item" data-zh="由网站安全系统拦截" data-en="Blocked by Website Security System">由网站安全系统拦截</span>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'zh';

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            const elements = document.querySelectorAll('[data-zh]');
            
            elements.forEach(el => {
                el.textContent = el.getAttribute(`data-${currentLang}`);
            });

            // 特殊处理页面标题 (Title)
            document.title = document.getElementById('page-title').getAttribute(`data-${currentLang}`);
            
            // 更新按钮文字
            document.getElementById('lang-btn').textContent = currentLang === 'zh' ? 'English' : '中文';
            
            // 更新时间格式
            updateTime();
        }

        function updateTime() {
            const locale = currentLang === 'zh' ? 'zh-CN' : 'en-US';
            document.getElementById('ban-time').textContent = new Date().toLocaleString(locale, { timeZone: 'Asia/Shanghai' });
        }

        // 初始化
        updateTime();
        
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(d => {
                document.getElementById('ip-address').textContent = d.ip;
            })
            .catch(() => { 
                const errorMsg = currentLang === 'zh' ? '获取失败' : 'Failed to load';
                document.getElementById('ip-address').textContent = errorMsg; 
            });
    </script>
</body>
</html>
