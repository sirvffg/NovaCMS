<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Instant 示例</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; }
        .container { max-width: 640px; margin: 0 auto; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 28px; margin-bottom: 20px; }
        .card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .card p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }

        .message { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
        .message.error { display: block; background: #fde8e8; color: #c0392b; border: 1px solid #f5c6c6; }
        .message.success { display: block; background: #e8f8e8; color: #27ae60; border: 1px solid #c6f5c6; }
        .message.info { display: block; background: #e8f0fe; color: #2c6fdb; border: 1px solid #c6d9f5; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: border-color .2s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #4f6ef7; box-shadow: 0 0 0 3px rgba(79,110,247,0.12); }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, opacity .2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #4f6ef7; color: #fff; }
        .btn-primary:hover { background: #3d5bd9; }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .btn-danger-sm { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; padding: 5px 12px; font-size: 13px; }
        .btn-danger-sm:hover { background: #fecaca; }
        .btn-outline { background: #fff; color: #666; border: 1px solid #ddd; }
        .btn-outline:hover { background: #f5f5f5; }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .instant-item { border: 1px solid #eee; border-radius: 10px; padding: 16px; margin-bottom: 12px; transition: box-shadow .2s; }
        .instant-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .instant-item .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .instant-item .id-badge { background: #eef2ff; color: #4f46e5; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
        .instant-item .time { color: #999; font-size: 12px; }
        .instant-item .content { font-size: 14px; color: #333; line-height: 1.6; white-space: pre-wrap; margin-bottom: 8px; }
        .instant-item .actions { display: flex; gap: 8px; align-items: center; }
        .instant-item .image-preview { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 6px; cursor: pointer; border: 1px solid #eee; }

        .pagination { display: flex; gap: 6px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
        .page-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; cursor: pointer; background: #fff; color: #666; transition: all .2s; }
        .page-btn:hover { border-color: #4f6ef7; color: #4f6ef7; }
        .page-btn.active { background: #4f6ef7; color: #fff; border-color: #4f6ef7; }
        .page-btn:disabled { opacity: .4; cursor: not-allowed; }

        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; display: block; }
        .footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 20px; padding-bottom: 20px; }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #333; display: flex; align-items: center; gap: 8px; }

        .response-box { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 14px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; margin-top: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; display: none; }
        .response-box.show { display: block; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }
        .checkbox-group label { font-size: 14px; color: #666; margin: 0; cursor: pointer; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .user-badge { font-size: 13px; color: #666; display: flex; align-items: center; gap: 8px; }
        .role-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .role-tag.admin { background: #fef3c7; color: #d97706; }
        .role-tag.user { background: #dbeafe; color: #2563eb; }
        .admin-only { display: none; }
        body.logged-in .admin-only { display: block; }
        body.is-admin .admin-only { display: block; }

        /* Login Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 12px; padding: 28px; width: 90%; max-width: 400px; margin: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Bar -->
        <div class="card" style="padding:16px 24px;">
            <div class="top-bar">
                <div style="display:flex;align-items:center;gap:10px;">
                    <strong style="font-size:16px;">💬 片刻</strong>
                    <span id="totalCount" style="font-size:13px;color:#999;"></span>
                </div>
                <div class="user-badge">
                    <span id="loginStatus"><button class="btn btn-outline" style="padding:5px 14px;font-size:13px;" onclick="showLogin()">登录</button></span>
                </div>
            </div>
        </div>

        <!-- Publish Form (admin only) -->
        <div id="publishCard" class="card" style="display:none;">
            <div class="section-title">✏️ 发布片刻</div>
            <div id="msgPub" class="message"></div>
            <div class="form-group">
                <textarea id="content" placeholder="写点什么..." rows="3"></textarea>
            </div>
            <div class="form-group">
                <input type="file" id="imageFile" accept="image/jpeg,image/png,image/gif,image/webp">
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-primary" id="btnPublish" onclick="handlePublish()">发布</button>
                <button class="btn btn-outline" onclick="fetchInstant()">刷新列表</button>
            </div>
            <div id="publishResponse" class="response-box"></div>
        </div>

        <!-- Instant List -->
        <div class="card">
            <div id="msgList" class="message"></div>
            <div id="instantList"><div class="empty-state"><span class="icon">⏳</span><p>加载中...</p></div></div>
            <div id="pagination" class="pagination"></div>
            <div id="listResponse" class="response-box"></div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal" onclick="if(event.target===this)hideLogin()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 style="margin-bottom:16px;">登录</h3>
            <div id="msgLogin" class="message"></div>
            <div class="form-group">
                <label>用户名 / 邮箱</label>
                <input type="text" id="username" placeholder="管理员或用户账号" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="输入密码" autocomplete="current-password">
            </div>
            <div class="checkbox-group" style="margin-bottom:16px;">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">记住我</label>
            </div>
            <div id="verifyArea" style="display:none;">
                <div class="form-group">
                    <label>邮箱验证码（已发送至 <strong id="emailHint"></strong>）</label>
                    <input type="text" id="code" placeholder="6 位数字" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                </div>
            </div>
            <button class="btn btn-primary" id="btnLogin" onclick="handleLogin()" style="width:100%;justify-content:center;">登录</button>
            <button class="btn btn-outline" style="margin-top:8px;width:100%;justify-content:center;" onclick="hideLogin()">取消</button>
            <div id="authResponse" class="response-box" style="margin-top:12px;"></div>
        </div>
    </div>

    <div class="footer">Nova JSON API Demo · GET 公开，写入需管理员权限</div>

    <script>
        // ---------- State ----------
        let sessionToken = '';
        let userRole = '';      // ''=未登录, 'admin', 'user'
        let userName = '';
        let loginUsername = '';
        let currentPage = 1;
        const API_INST = '/nova-json/v1/statuses/instant';
        const API_AUTH = '/nova-json/v1/auth';

        // ---------- UI ----------
        function showMsg(id, text, type) { const el = document.getElementById(id); el.textContent = text; el.className = 'message '+type; }
        function hideMsg(id) { document.getElementById(id).className = 'message'; }
        function showResponse(id, d) { const el = document.getElementById(id); el.textContent = JSON.stringify(d,null,2); el.classList.add('show'); }
        function hideResponse(id) { document.getElementById(id).classList.remove('show'); }
        function escapeHtml(s) { if(typeof s!=='string')return s; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
        function setLoading(bid, l) { const b=document.getElementById(bid); b.disabled=l; b.innerHTML=l?'<span class="spinner"></span>处理中...':b.dataset.text; }

        // ---------- Login Modal ----------
        function showLogin() {
            document.getElementById('loginModal').classList.add('show');
            hideMsg('msgLogin');
            hideResponse('authResponse');
            document.getElementById('verifyArea').style.display = 'none';
            document.getElementById('btnLogin').dataset.text = '登录';
            document.getElementById('btnLogin').innerHTML = '登录';
        }
        function hideLogin() { document.getElementById('loginModal').classList.remove('show'); }

        // ---------- Update UI by Role ----------
        function updateUI() {
            const statusEl = document.getElementById('loginStatus');
            const publishCard = document.getElementById('publishCard');

            if (sessionToken && userRole) {
                const roleLabel = userRole === 'admin' ? '<span class="role-tag admin">管理员</span>' : '<span class="role-tag user">用户</span>';
                statusEl.innerHTML = roleLabel + ' ' + escapeHtml(userName) + ' <button class="btn btn-outline" style="padding:3px 10px;font-size:12px;color:#dc2626;" onclick="handleLogout()">退出</button>';

                if (userRole === 'admin') {
                    publishCard.style.display = 'block';
                } else {
                    publishCard.style.display = 'none';
                }
            } else {
                statusEl.innerHTML = '<button class="btn btn-outline" style="padding:5px 14px;font-size:13px;" onclick="showLogin()">登录</button>';
                publishCard.style.display = 'none';
            }

            // 重新渲染列表（控制删除按钮）
            if (window._lastItems) renderList(window._lastItems, window._lastTotal);
        }

        // ---------- Login ----------
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username||!password) { showMsg('msgLogin','请输入账号和密码','error'); return; }

            const verifyArea = document.getElementById('verifyArea');
            const code = document.getElementById('code').value.trim();

            hideMsg('msgLogin');
            setLoading('btnLogin', true);

            try {
                if (verifyArea.style.display === 'block' && code) {
                    // 验证阶段
                    const res = await fetch(API_AUTH+'/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:loginUsername, code, remember_me:document.getElementById('rememberMe').checked}) });
                    const data = await res.json();
                    showResponse('authResponse', data);

                    if (data.code !== 'rest_ok') {
                        showMsg('msgLogin', data.message||'验证失败','error');
                        setLoading('btnLogin',false);
                        return;
                    }

                    sessionToken = data.data.token;
                    userRole = (data.data.user ? data.data.user.role : null) || 'user';
                    userName = (data.data.user ? data.data.user.username : null) || username;
                    if (document.getElementById('rememberMe').checked) localStorage.setItem('nova_token', sessionToken);
                    else localStorage.removeItem('nova_token');

                    hideLogin();
                    updateUI();
                } else {
                    // 登录阶段
                    const res = await fetch(API_AUTH+'/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, password}) });
                    const data = await res.json();
                    showResponse('authResponse', data);

                    if (data.code !== 'rest_ok') {
                        showMsg('msgLogin', data.message||'登录失败','error');
                        setLoading('btnLogin',false);
                        return;
                    }

                    if (data.data.requires_verification) {
                        loginUsername = username;
                        document.getElementById('emailHint').textContent = data.data.email_hint;
                        verifyArea.style.display = 'block';
                        document.getElementById('code').focus();
                        document.getElementById('btnLogin').dataset.text = '验证';
                        document.getElementById('btnLogin').innerHTML = '验证';
                        setLoading('btnLogin', false);
                        return;
                    }

                    // 无需验证码
                    sessionToken = data.data.token;
                    userRole = (data.data.user ? data.data.user.role : null) || 'user';
                    userName = (data.data.user ? data.data.user.username : null) || username;
                    if (document.getElementById('rememberMe').checked) localStorage.setItem('nova_token', sessionToken);
                    else localStorage.removeItem('nova_token');

                    hideLogin();
                    updateUI();
                }
            } catch(err) { showMsg('msgLogin','网络错误: '+err.message,'error'); }
            setLoading('btnLogin', false);
        }

        // ---------- Logout ----------
        async function handleLogout() {
            try { await fetch(API_AUTH+'/logout', { method:'POST', headers:sessionToken?{'Authorization':'Bearer '+sessionToken}:{} }); } catch(_) {}
            localStorage.removeItem('nova_token');
            sessionToken = '';
            userRole = '';
            userName = '';
            updateUI();
        }

        // ---------- Fetch & Render ----------
        function renderList(items, total) {
            const listEl = document.getElementById('instantList');
            if (!items||items.length===0) {
                listEl.innerHTML = '<div class="empty-state"><span class="icon">💬</span><p>暂无片刻</p></div>';
                return;
            }

            let html = '';
            items.forEach(function(item) {
                const imgHtml = item.image_path ? '<div><img class="image-preview" src="'+escapeHtml(item.image_path)+'" onclick="window.open(this.src)" alt="片刻图片"></div>' : '';
                const deleteBtn = (userRole === 'admin')
                    ? '<button class="btn btn-danger-sm" onclick="handleDelete('+item.id+')">🗑️ 删除</button>'
                    : '';
                html +=
                    '<div class="instant-item" id="inst-'+item.id+'">' +
                        '<div class="meta"><span class="id-badge">#'+item.id+'</span><span class="time">'+escapeHtml(item.created_at||'')+'</span></div>' +
                        '<div class="content">'+escapeHtml(item.content)+'</div>' +
                        imgHtml +
                        (deleteBtn ? '<div class="actions">'+deleteBtn+'</div>' : '') +
                    '</div>';
            });
            listEl.innerHTML = html;
        }

        async function fetchInstant(page) {
            if (page !== undefined) currentPage = page;
            const listEl = document.getElementById('instantList');
            const paginationEl = document.getElementById('pagination');
            listEl.innerHTML = '<div class="empty-state"><span class="icon">⏳</span><p>加载中...</p></div>';
            hideMsg('msgList');
            hideResponse('listResponse');

            try {
                const res = await fetch(API_INST, { headers: sessionToken?{'Authorization':'Bearer '+sessionToken}:{} });
                const data = await res.json();
                showResponse('listResponse', data);

                if (data.code !== 'rest_ok') {
                    listEl.innerHTML = '<div class="empty-state"><span class="icon">⚠️</span><p>'+(data.message||'获取失败')+'</p></div>';
                    return;
                }

                const items = data.data.items;
                const total = data.data.total;
                window._lastItems = items;
                window._lastTotal = total;

                document.getElementById('totalCount').textContent = '共 '+total+' 条';
                renderList(items, total);

                // Pagination
                const totalPages = Math.ceil(total / (data.data.per_page||20));
                if (totalPages <= 1) { paginationEl.innerHTML = ''; return; }
                let pHtml = '';
                pHtml += '<button class="page-btn" onclick="fetchInstant('+(currentPage-1)+')"'+(currentPage<=1?' disabled':'')+'>‹</button>';
                for (let i=1;i<=totalPages;i++) pHtml += '<button class="page-btn'+(i===currentPage?' active':'')+'" onclick="fetchInstant('+i+')">'+i+'</button>';
                pHtml += '<button class="page-btn" onclick="fetchInstant('+(currentPage+1)+')"'+(currentPage>=totalPages?' disabled':'')+'>›</button>';
                paginationEl.innerHTML = pHtml;
            } catch(err) {
                listEl.innerHTML = '<div class="empty-state"><span class="icon">⚠️</span><p>网络错误: '+escapeHtml(err.message)+'</p></div>';
            }
        }

        // ---------- Delete ----------
        async function handleDelete(id) {
            if (!confirm('确定删除 #ID: '+id+' 吗？')) return;
            hideMsg('msgList');
            try {
                const res = await fetch(API_INST+'/'+id, { method:'DELETE', headers:sessionToken?{'Authorization':'Bearer '+sessionToken}:{} });
                const data = await res.json();
                showResponse('listResponse', data);
                if (data.code === 'rest_ok') {
                    showMsg('msgList','✅ 已删除 #'+id+'，剩余 '+data.data.remaining+' 条，ID 已重排','success');
                    currentPage = 1;
                    fetchInstant(1);
                } else { showMsg('msgList','❌ '+(data.message||'删除失败'),'error'); }
            } catch(err) { showMsg('msgList','网络错误: '+err.message,'error'); }
        }

        // ---------- Publish ----------
        async function handlePublish() {
            const content = document.getElementById('content').value.trim();
            if (!content) { showMsg('msgPub','内容不能为空','error'); return; }
            hideMsg('msgPub');
            hideResponse('publishResponse');
            setLoading('btnPublish',true);
            try {
                const fd = new FormData(); fd.append('content', content);
                const fi = document.getElementById('imageFile');
                if (fi.files.length>0) fd.append('image', fi.files[0]);
                const res = await fetch(API_INST, { method:'POST', headers:sessionToken?{'Authorization':'Bearer '+sessionToken}:{}, body:fd });
                const data = await res.json();
                showResponse('publishResponse', data);
                if (data.code === 'rest_ok') {
                    showMsg('msgPub','✅ 发布成功！ID: '+data.data.id,'success');
                    document.getElementById('content').value=''; document.getElementById('imageFile').value='';
                    currentPage=1; fetchInstant(1);
                } else { showMsg('msgPub','❌ '+(data.message||'发布失败'),'error'); }
            } catch(err) { showMsg('msgPub','网络错误: '+err.message,'error'); }
            setLoading('btnPublish',false);
        }

        // ---------- Init ----------
        (function init() {
            document.querySelectorAll('.btn').forEach(b=>{if(!b.dataset.text)b.dataset.text=b.innerHTML;});
            document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});
            document.getElementById('code').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});

            const token = localStorage.getItem('nova_token');
            if (token) {
                (async function() {
                    try {
                        const res = await fetch(API_AUTH+'/me', { headers:{'Authorization':'Bearer '+token} });
                        const data = await res.json();
                        if (data.code === 'rest_ok') {
                            sessionToken = token;
                            userRole = (data.data.user ? data.data.user.role : null) || 'user';
                            userName = (data.data.user ? data.data.user.username : null) || '';
                            updateUI();
                        }
                    } catch(_) {}
                    fetchInstant();
                })();
            } else {
                fetchInstant();
            }
        })();
    </script>
</body>
</html>
