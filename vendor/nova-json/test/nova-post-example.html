<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Post API 示例</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --border: #2a2d3a;
  --text: #e4e6ed;
  --text-muted: #8b8fa3;
  --accent: #6c8aff;
  --accent-hover: #8ba4ff;
  --success: #34d399;
  --warning: #fbbf24;
  --danger: #f87171;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
.header h1 span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 12px; }
.login-badge {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: var(--border);
  color: var(--text-muted);
}
.login-badge.logged-in { background: rgba(52,211,153,.15); color: var(--success); }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: var(--radius);
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  text-decoration: none;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-success { background: var(--success); color: #000; }
.btn-warning { background: var(--warning); color: #000; }
.btn-danger { background: var(--danger); color: #fff; }

.main {
  flex: 1;
  display: flex;
  gap: 0;
}
.sidebar {
  width: 340px;
  min-width: 340px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-header h2 { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.post-list { flex: 1; overflow-y: auto; padding: 8px; }
.post-item {
  padding: 12px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
  margin-bottom: 4px;
  border: 1px solid transparent;
}
.post-item:hover { background: rgba(108,138,255,.06); border-color: var(--border); }
.post-item.active { background: rgba(108,138,255,.1); border-color: var(--accent); }
.post-item-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.post-item-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.badge-privacy { background: rgba(251,191,36,.15); color: var(--warning); }
.badge-paid { background: rgba(248,113,113,.15); color: var(--danger); }
.badge-sticky { background: rgba(108,138,255,.15); color: var(--accent); }

.content {
  flex: 1;
  padding: 32px 40px;
  overflow-y: auto;
}
.content-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  text-align: center;
  gap: 12px;
}
.content-placeholder svg { opacity: .3; width: 64px; height: 64px; }
.content-placeholder p { font-size: 14px; }

.post-detail { max-width: 800px; }
.post-detail h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
.post-detail .meta { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap; }
.post-detail .meta span { display: flex; align-items: center; gap: 4px; }
.post-detail .content-body {
  font-size: 15px;
  line-height: 1.8;
  color: #c8cbd8;
}
.post-detail .content-body h1, .post-detail .content-body h2, .post-detail .content-body h3 { color: var(--text); margin: 24px 0 12px; }
.post-detail .content-body p { margin-bottom: 16px; }
.post-detail .content-body pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  overflow-x: auto;
  font-size: 13px;
  margin: 16px 0;
}
.post-detail .content-body code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }

/* Access panels */
.access-panel {
  margin-top: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.access-panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.access-panel.privacy { border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.04); }
.access-panel.paid { border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.04); }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
.form-group input, .form-group textarea {
  width: 100%;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 60px; font-family: inherit; }
.form-actions { display: flex; gap: 8px; margin-top: 8px; }
.status-msg {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 12px;
  display: none;
}
.status-msg.success { display: block; background: rgba(52,211,153,.1); color: var(--success); border: 1px solid rgba(52,211,153,.2); }
.status-msg.error { display: block; background: rgba(248,113,113,.1); color: var(--danger); border: 1px solid rgba(248,113,113,.2); }
.status-msg.info { display: block; background: rgba(108,138,255,.1); color: var(--accent); border: 1px solid rgba(108,138,255,.2); }

/* Login modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 32px;
  width: 400px;
  max-width: 90vw;
}
.modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
.modal .form-group { margin-bottom: 16px; }
.modal .form-actions { justify-content: flex-end; margin-top: 20px; }
.auth-step { display: none; }
.auth-step.active { display: block; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 768px) {
  .main { flex-direction: column; }
  .sidebar { width: 100%; min-width: unset; max-height: 240px; border-right: none; border-bottom: 1px solid var(--border); }
  .content { padding: 20px; }
}
</style>
</head>
<body>

<div class="header">
  <h1><span>Nova</span> Post API</h1>
  <div class="header-right">
    <span class="login-badge" id="loginBadge">未登录</span>
    <button class="btn btn-primary btn-sm" id="loginBtn" onclick="openLogin()">登录</button>
    <button class="btn btn-outline btn-sm" id="logoutBtn" style="display:none" onclick="logout()">退出</button>
  </div>
</div>

<div class="main">
  <!-- Sidebar: post list -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>文章列表</h2>
      <button class="btn btn-outline btn-sm" onclick="loadPosts()">刷新</button>
    </div>
    <div class="post-list" id="postList">
      <div class="content-placeholder" style="height:200px;padding:20px">
        <p>加载中...</p>
      </div>
    </div>
  </div>

  <!-- Content area -->
  <div class="content" id="contentArea">
    <div class="content-placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-3-3v6m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      <p>选择左侧一篇文章查看详情</p>
    </div>
    <div class="post-detail" id="postDetail" style="display:none"></div>
  </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <div class="auth-step active" id="step1">
      <h2>登录</h2>
      <div class="form-group">
        <label>用户名 / 邮箱</label>
        <input type="text" id="loginUsername" placeholder="输入用户名或邮箱">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="closeLogin()">取消</button>
        <button class="btn btn-primary" onclick="doLogin()">登录</button>
      </div>
      <div class="status-msg" id="loginMsg"></div>
    </div>
    <div class="auth-step" id="step2">
      <h2>邮箱验证</h2>
      <p style="font-size:14px;color:var(--text-muted);margin-bottom:16px">验证码已发送到 <strong id="emailMask"></strong></p>
      <div class="form-group">
        <label>验证码</label>
        <input type="text" id="verifyCode" placeholder="输入6位验证码" maxlength="6" onkeydown="if(event.key==='Enter')doVerify()">
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="closeLogin()">取消</button>
        <button class="btn btn-primary" onclick="doVerify()">验证</button>
      </div>
      <div class="status-msg" id="verifyMsg"></div>
    </div>
  </div>
</div>

<script>
const API_BASE = '/nova-json/v1';

// ── Auth state ──
let authToken = localStorage.getItem('nova_token') || '';
let currentUser = null;
let currentPostId = null;

function isLoggedIn() { return !!authToken; }

function updateAuthUI() {
  const badge = document.getElementById('loginBadge');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  if (isLoggedIn()) {
    badge.textContent = '已登录: ' + (currentUser ? currentUser.username : '...');
    badge.className = 'login-badge logged-in';
    loginBtn.style.display = 'none';
    logoutBtn.style.display = '';
  } else {
    badge.textContent = '未登录';
    badge.className = 'login-badge';
    loginBtn.style.display = '';
    logoutBtn.style.display = 'none';
  }
}

// ── Auth headers ──
function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  return h;
}

// ── Login ──
function openLogin() {
  document.getElementById('loginModal').classList.add('open');
  document.getElementById('step1').classList.add('active');
  document.getElementById('step2').classList.remove('active');
  document.getElementById('loginMsg').className = 'status-msg';
  document.getElementById('verifyMsg').className = 'status-msg';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('verifyCode').value = '';
}
function closeLogin() {
  document.getElementById('loginModal').classList.remove('open');
}

async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) { showLoginMsg('error', '请填写用户名和密码'); return; }

  showLoginMsg('info', '正在登录...');
  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.code === 'rest_ok') {
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('emailMask').textContent = data.data.email_mask || '***';
      document.getElementById('loginMsg').className = 'status-msg';
    } else {
      showLoginMsg('error', data.message || '登录失败');
    }
  } catch(e) {
    showLoginMsg('error', '网络错误: ' + e.message);
  }
}

async function doVerify() {
  const code = document.getElementById('verifyCode').value.trim();
  if (!code) { showVerifyMsg('error', '请输入验证码'); return; }

  showVerifyMsg('info', '验证中...');
  try {
    const res = await fetch(API_BASE + '/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.code === 'rest_ok') {
      authToken = data.data.token;
      currentUser = data.data.user;
      localStorage.setItem('nova_token', authToken);
      updateAuthUI();
      closeLogin();
      if (currentPostId) loadPostDetail(currentPostId);
    } else {
      showVerifyMsg('error', data.message || '验证失败');
    }
  } catch(e) {
    showVerifyMsg('error', '网络错误: ' + e.message);
  }
}

function showLoginMsg(type, text) {
  const el = document.getElementById('loginMsg');
  el.className = 'status-msg ' + type;
  el.textContent = text;
}
function showVerifyMsg(type, text) {
  const el = document.getElementById('verifyMsg');
  el.className = 'status-msg ' + type;
  el.textContent = text;
}

async function logout() {
  if (authToken) {
    try {
      await fetch(API_BASE + '/auth/logout', {
        method: 'POST',
        headers: authHeaders()
      });
    } catch(e) {
      // silently ignore
    }
    authToken = '';
    currentUser = null;
    localStorage.removeItem('nova_token');
    updateAuthUI();
    if (currentPostId) loadPostDetail(currentPostId);
  } else {
    authToken = '';
    currentUser = null;
    localStorage.removeItem('nova_token');
    updateAuthUI();
  }
}

// ── Posts ──
async function loadPosts() {
  const listEl = document.getElementById('postList');
  listEl.innerHTML = '<div class="content-placeholder" style="height:200px;padding:20px"><p>加载中...</p></div>';
  try {
    const res = await fetch(API_BASE + '/posts');
    const data = await res.json();
    if (data.code !== 'rest_ok' || !data.data || !data.data.items) {
      listEl.innerHTML = '<div class="content-placeholder" style="height:200px;padding:20px"><p>加载失败</p></div>';
      return;
    }
    renderPostList(data.data.items);
  } catch(e) {
    listEl.innerHTML = '<div class="content-placeholder" style="height:200px;padding:20px"><p>网络错误: ' + e.message + '</p></div>';
  }
}

function renderPostList(posts) {
  const listEl = document.getElementById('postList');
  if (!posts.length) {
    listEl.innerHTML = '<div class="content-placeholder" style="height:200px;padding:20px"><p>暂无文章</p></div>';
    return;
  }
  listEl.innerHTML = '';
  posts.forEach(function(p) {
    var item = document.createElement('div');
    item.className = 'post-item' + (currentPostId == p.id ? ' active' : '');
    item.onclick = function() { loadPostDetail(p.id); };

    var badges = '';
    if (p.is_sticky) badges += '<span class="badge badge-sticky">置顶</span>';
    if (p.has_privacy_content) badges += '<span class="badge badge-privacy">隐私</span>';
    if (p.has_paid_content) badges += '<span class="badge badge-paid">付费</span>';

    item.innerHTML =
      '<div class="post-item-title">' + escHtml(p.title) + ' ' + badges + '</div>' +
      '<div class="post-item-meta"><span>' + (p.category || '未分类') + '</span><span>' + (p.created_at || '') + '</span></div>';
    listEl.appendChild(item);
  });
}

async function loadPostDetail(id) {
  currentPostId = id;
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('postDetail').style.display = 'block';
  document.getElementById('postDetail').innerHTML = '<p style="color:var(--text-muted)">加载中...</p>';

  // Update active state
  document.querySelectorAll('.post-item').forEach(function(el) { el.classList.remove('active'); });
  var items = document.querySelectorAll('.post-item');
  for (var i = 0; i < items.length; i++) {
    if (items[i].onclick && items[i].onclick.toString().includes("loadPostDetail(" + id + ")")) {
      items[i].classList.add('active');
      break;
    }
  }

  try {
    var res = await fetch(API_BASE + '/posts/' + id, { headers: authHeaders() });
    var data = await res.json();
    if (data.code !== 'rest_ok' || !data.data || !data.data.item) {
      document.getElementById('postDetail').innerHTML = '<p style="color:var(--danger)">文章不存在</p>';
      return;
    }
    renderPostDetail(data.data.item);
  } catch(e) {
    document.getElementById('postDetail').innerHTML = '<p style="color:var(--danger)">网络错误: ' + e.message + '</p>';
  }
}

function renderPostDetail(post) {
  var el = document.getElementById('postDetail');

  var badges = '';
  if (post.is_sticky) badges += '<span class="badge badge-sticky" style="margin-right:6px">置顶</span>';
  if (post.has_privacy_content) badges += '<span class="badge badge-privacy" style="margin-right:6px">隐私内容</span>';
  if (post.has_paid_content) badges += '<span class="badge badge-paid">付费内容</span>';

  var privacyPanel = '';
  if (post.has_privacy_content) {
    var hasAccess = post.current_user_has_privacy_access;
    if (hasAccess) {
      privacyPanel = '<div class="access-panel privacy"><h3>🔑 隐私内容</h3><p style="color:var(--success)">您已有权限查看隐私内容</p></div>';
    } else if (isLoggedIn()) {
      privacyPanel = '<div class="access-panel privacy" id="privacyPanel"><h3>🔒 隐私内容</h3>' +
        '<p style="color:var(--text-muted)" id="privacyQuestion">加载问题中...</p>' +
        '<div class="form-group"><label>回答</label><input type="text" id="privacyAnswer" placeholder="输入答案"></div>' +
        '<div class="form-actions"><button class="btn btn-warning btn-sm" onclick="submitPrivacy(' + post.id + ')">提交答案</button></div>' +
        '<div class="status-msg" id="privacyMsg"></div></div>';
    } else {
      privacyPanel = '<div class="access-panel privacy"><h3>🔒 隐私内容</h3><p style="color:var(--text-muted)">请先登录后申请访问隐私内容</p></div>';
    }
  }

  var paidPanel = '';
  if (post.has_paid_content) {
    var hasPaid = post.current_user_has_paid_access;
    if (hasPaid) {
      paidPanel = '<div class="access-panel paid"><h3>💰 付费内容</h3><p style="color:var(--success)">您已付费，可以查看付费内容</p></div>';
    } else if (isLoggedIn()) {
      paidPanel = '<div class="access-panel paid"><h3>💰 付费内容</h3>' +
        '<p style="color:var(--text-muted);margin-bottom:12px">此内容需要支付后才能查看</p>' +
        '<div class="form-actions"><button class="btn btn-success btn-sm" onclick="checkPaid(' + post.id + ')">检查支付状态</button></div>' +
        '<div class="status-msg" id="paidMsg"></div></div>';
    } else {
      paidPanel = '<div class="access-panel paid"><h3>💰 付费内容</h3><p style="color:var(--text-muted)">请先登录后查看付费信息</p></div>';
    }
  }

  el.innerHTML =
    '<h2>' + escHtml(post.title) + '</h2>' +
    '<div class="meta">' +
      '<span>📁 ' + escHtml(post.category || '未分类') + '</span>' +
      '<span>🏷️ ' + escHtml(post.tags || '无标签') + '</span>' +
      '<span>📅 ' + (post.created_at || '') + '</span>' +
      '<span>👁️ ' + (post.views || 0) + ' 次浏览</span>' +
      badges +
    '</div>' +
    '<div class="content-body">' + (post.content || '') + '</div>' +
    privacyPanel +
    paidPanel;

  // 自动获取隐私问题
  if (post.has_privacy_content && isLoggedIn() && !post.current_user_has_privacy_access) {
    fetchPrivacyQuestion(post.id);
  }
}

async function fetchPrivacyQuestion(postId) {
  try {
    var res = await fetch(API_BASE + '/posts/privacy', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ post_id: postId })
    });
    var data = await res.json();
    var qEl = document.getElementById('privacyQuestion');
    var answerEl = document.getElementById('privacyAnswer');
    if (!qEl) return;
    if (data.code === 'rest_need_answer' && data.data) {
      var question = data.data.question || '请回答隐私问题';
      var customText = data.data.custom_text || '';
      qEl.innerHTML = '<strong>问题：</strong>' + escHtml(question);
      if (customText) {
        qEl.innerHTML += '<br><small style="color:var(--text-muted)">' + escHtml(customText) + '</small>';
      }
      if (answerEl) answerEl.placeholder = '输入答案';
    } else {
      qEl.textContent = '请回答隐私问题';
    }
  } catch(e) {
    var qEl = document.getElementById('privacyQuestion');
    if (qEl) qEl.textContent = '加载失败，请重试';
  }
}

// ── Privacy ──
async function submitPrivacy(postId) {
  var answer = document.getElementById('privacyAnswer').value.trim();
  if (!answer) { showPrivacyMsg('error', '请填写答案'); return; }

  showPrivacyMsg('info', '提交中...');
  try {
    var res = await fetch(API_BASE + '/posts/privacy', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ post_id: postId, answer: answer })
    });
    var data = await res.json();
    if (data.code === 'rest_ok' && data.data.access_granted) {
      showPrivacyMsg('success', data.message || '验证通过！');
      setTimeout(function() { loadPostDetail(postId); }, 1000);
    } else if (data.data && data.data.pending_approval) {
      showPrivacyMsg('info', data.message || '已提交，等待管理员审核');
    } else {
      showPrivacyMsg('error', data.message || '答案错误');
    }
  } catch(e) {
    showPrivacyMsg('error', '网络错误: ' + e.message);
  }
}

function showPrivacyMsg(type, text) {
  var el = document.getElementById('privacyMsg');
  if (!el) return;
  el.className = 'status-msg ' + type;
  el.textContent = text;
}

// ── Paid ──
async function checkPaid(postId) {
  showPaidMsg('info', '检查中...');
  try {
    var res = await fetch(API_BASE + '/posts/paid', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ post_id: postId })
    });
    var data = await res.json();
    if (data.code === 'rest_ok') {
      if (data.data.has_access) {
        showPaidMsg('success', data.message || '您已获得付费内容权限！');
        setTimeout(function() { loadPostDetail(postId); }, 1000);
      } else {
        var price = data.data.price || 0;
        var payUrl = data.data.pay_url || '#';
        showPaidMsg('info', '需要支付 ¥' + price.toFixed(2) + '，即将跳转支付...');
        // 显示支付链接
        var msgEl = document.getElementById('paidMsg');
        msgEl.innerHTML = msgEl.textContent + '<br><a href="' + payUrl + '" target="_blank" class="btn btn-success btn-sm" style="margin-top:8px;text-decoration:none">前往支付</a>';
        msgEl.className = 'status-msg info';
      }
    } else {
      showPaidMsg('error', data.message || '检查失败');
    }
  } catch(e) {
    showPaidMsg('error', '网络错误: ' + e.message);
  }
}

function showPaidMsg(type, text) {
  var el = document.getElementById('paidMsg');
  if (!el) return;
  el.className = 'status-msg ' + type;
  el.textContent = text;
}

// ── Helpers ──
function escHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Init ──
updateAuthUI();
loadPosts();
</script>
