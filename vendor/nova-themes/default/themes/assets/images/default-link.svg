<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <!-- 主色渐变 -->
    <linearGradient id="mainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>

  <!-- 图标主体 -->
  <g filter="url(#shadow)">
    <!-- 左侧链环 -->
    <path d="M19 17.5 C14.5 17.5 12 20.5 12 24 C12 27.5 14.5 30.5 19 30.5" 
          stroke="url(#mainGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M22.5 24 L15.5 24" 
          stroke="url(#mainGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- 右侧链环 -->
    <path d="M29 17.5 C33.5 17.5 36 20.5 36 24 C36 27.5 33.5 30.5 29 30.5" 
          stroke="url(#mainGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M25.5 24 L32.5 24" 
          stroke="url(#mainGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- 中间连接圆点（带光晕） -->
    <circle cx="24" cy="24" r="3" fill="url(#mainGrad)" stroke="white" stroke-width="1.5"/>
  </g>
</svg>