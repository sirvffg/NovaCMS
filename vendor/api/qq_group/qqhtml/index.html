<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ群聊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-transition-duration: 1s;
        }
        
        body {
            background: #333;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity var(--bg-transition-duration) ease-in-out;
        }
        
        .bg-current {
            opacity: 1;
            z-index: -1;
        }
        
        .bg-next {
            opacity: 0;
            z-index: -2;
        }
        
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .qq-group-card {
            transition: transform 0.3s ease;
            border-radius: 16px;
            overflow: hidden;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .qq-group-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .card-body {
            min-height: 280px;
            height: 100%;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .group-info-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
        }
        
        .group-id-display {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
        }
        
        .copy-group-btn {
            background: transparent;
            border: none;
            color: #0d6efd;
            font-size: 0.85rem;
            padding: 2px 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }
        
        .copy-group-btn:hover {
            background: rgba(13, 110, 253, 0.1);
            color: #0a58ca;
        }
        
        .copy-group-btn:active {
            transform: scale(0.95);
        }
        
        .copy-group-btn.btn-success {
            color: #198754;
        }
        
        .copy-group-btn.btn-success:hover {
            background: rgba(25, 135, 84, 0.1);
            color: #146c43;
        }
        
        .copy-group-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .notification-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .notification-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 0;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .notification-header {
            background: #a9e4f8;
            padding: 20px 24px;
            color: white;
        }

        .notification-header h5 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .notification-body {
            padding: 0;
            overflow: visible;
            background: transparent;
            min-height: 100px;
        }

        .notification-body iframe {
            width: 100%;
            border: none;
            display: block;
            overflow: visible;
        }

        .notification-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            text-align: right;
            background: rgba(255, 255, 255, 0.5);
        }

        .notification-footer button {
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .notification-footer button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .notification-footer .wait-timer {
            color: #6c757d;
            font-size: 0.875rem;
            margin-right: 12px;
        }
    </style>
</head>
<body>

    <!-- 背景层 -->
    <div id="bg-layer-1" class="bg-layer bg-current"></div>
    <div id="bg-layer-2" class="bg-layer bg-next"></div>
    <div class="bg-overlay"></div>

    <!-- 通知浮窗 -->
    <div id="notification-modal" class="notification-modal" style="display: none;">
        <div class="notification-content">
            <div class="notification-header">
                <h5><i class="bi bi-bell me-2"></i>系统通知</h5>
            </div>
                            <div class="notification-body" id="notification-body">
                                <!-- 通知内容将在这里显示 -->
                            </div>
                            <div class="notification-footer">
                                <span class="wait-timer" id="waitTimer" style="display: none;"></span>
                                <button class="btn btn-primary" id="closeNotificationBtn" onclick="closeNotification()">
                                    <i class="bi bi-check-lg me-1"></i><span id="closeBtnText">我知道了</span>
                                </button>
                            </div>
        </div>
    </div>

    <div class="container py-5" style="position: relative; z-index: 1;">
        <div class="text-center mb-3">
            <h1 class="fw-bold text-white mb-2" style="text-shadow: 0 2px 4px rgba(0,0,0,0.2);">QQ群聊</h1>
        </div>

        <div id="groups-container" class="row g-4">
            <!-- 加载动画 -->
            <div id="loading" class="col-12 text-center py-5">
                <div class="spinner-border text-white" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="text-white-50 mt-3">正在加载群聊列表...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========================================
        // 配置区域 - 请在此处修改您的API地址
        // ========================================
        const API_URL = 'https://lygalaxy.cn/vendor/api/qq_group/get_groups.php';
        // ========================================

        // 全局变量
        let GROUP_INFO_API_URL = '';

        // 显示通知浮窗
        function showNotification(content, waitTime = 0, buttonText = '我知道了') {
            const modal = document.getElementById('notification-modal');
            const body = document.getElementById('notification-body');
            const closeBtn = document.getElementById('closeNotificationBtn');
            const waitTimer = document.getElementById('waitTimer');

            if (modal && body && content) {
                // 更新按钮文字
                const btnTextSpan = document.getElementById('closeBtnText');
                if (btnTextSpan) {
                    btnTextSpan.textContent = buttonText;
                }

                // 创建 iframe 来隔离通知内容的样式
                const iframeId = 'notification-iframe-' + Date.now();
                const iframeHtml = `
                    <iframe id="${iframeId}" style="width: 100%; border: none; min-height: 100px;"></iframe>
                `;
                body.innerHTML = iframeHtml;

                // 等待 iframe 创建完成后写入内容
                setTimeout(() => {
                    const iframe = document.getElementById(iframeId);
                    if (iframe) {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        doc.open();
                        doc.write(`
                            <!DOCTYPE html>
                            <html>
                            <head>
                                <meta charset="UTF-8">
                                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                <style>
                                    * { margin: 0; padding: 0; box-sizing: border-box; }
                                    html, body { padding: 24px; font-family: inherit; color: #333; line-height: 1.6; overflow: auto; }
                                </style>
                            </head>
                            <body>${content}</body>
                            </html>
                        `);
                        doc.close();

                        // 调整 iframe 高度以适应内容
                        const adjustHeight = () => {
                            try {
                                const bodyHeight = doc.body.scrollHeight;
                                const viewportHeight = window.innerHeight * 0.6;
                                const contentHeight = doc.documentElement.scrollHeight;

                                // 如果内容超过视口的60%，限制高度并启用iframe内部滚动
                                if (contentHeight > viewportHeight) {
                                    iframe.style.height = viewportHeight + 'px';
                                    // 确保iframe内部可以滚动
                                    if (doc.body.style) {
                                        doc.body.style.overflow = 'auto';
                                    }
                                } else {
                                    iframe.style.height = bodyHeight + 'px';
                                    // 内容较少时隐藏滚动
                                    if (doc.body.style) {
                                        doc.body.style.overflow = 'visible';
                                    }
                                }
                            } catch (e) {
                                // 跨域时无法访问，设置默认高度
                                iframe.style.height = '300px';
                            }
                        };

                        // 初始调整高度
                        setTimeout(adjustHeight, 100);

                        // 监听 iframe 内内容变化（同域情况下）
                        try {
                            if (doc.body) {
                                new MutationObserver(adjustHeight).observe(doc.body, {
                                    childList: true,
                                    subtree: true,
                                    attributes: true
                                });
                            }
                        } catch (e) {
                            // 跨域或安全限制，忽略
                        }
                    }
                }, 10);

                modal.style.display = 'flex';

                // 阻止背景滚动
                document.body.style.overflow = 'hidden';

                // 处理等待时间
                if (waitTime > 0) {
                    closeBtn.disabled = true;
                    const btnTextSpan = document.getElementById('closeBtnText');
                    if (btnTextSpan) {
                        btnTextSpan.textContent = '请稍候...';
                    }

                    let remainingTime = waitTime;
                    waitTimer.style.display = 'inline';
                    waitTimer.textContent = `${remainingTime}秒后可关闭`;

                    const timer = setInterval(() => {
                        remainingTime--;
                        if (remainingTime <= 0) {
                            clearInterval(timer);
                            closeBtn.disabled = false;
                            if (btnTextSpan) {
                                btnTextSpan.textContent = buttonText;
                            }
                            waitTimer.style.display = 'none';
                        } else {
                            waitTimer.textContent = `${remainingTime}秒后可关闭`;
                        }
                    }, 1000);
                } else {
                    closeBtn.disabled = false;
                    const btnTextSpan = document.getElementById('closeBtnText');
                    if (btnTextSpan) {
                        btnTextSpan.textContent = buttonText;
                    }
                    waitTimer.style.display = 'none';
                }
            }
        }

        // 关闭通知浮窗（全局函数）
        function closeNotification() {
            const modal = document.getElementById('notification-modal');
            if (modal) {
                modal.style.animation = 'fadeOut 0.3s ease';

                setTimeout(() => {
                    modal.style.display = 'none';
                    modal.style.animation = '';
                    // 恢复背景滚动
                    document.body.style.overflow = '';
                }, 300);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 点击模态框外部关闭
            document.getElementById('notification-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeNotification();
                }
            });

            // ESC键关闭通知
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    const modal = document.getElementById('notification-modal');
                    if (modal && modal.style.display === 'flex') {
                        closeNotification();
                    }
                }
            });

            // 背景轮播逻辑
            const bgLayer1 = document.getElementById('bg-layer-1');
            const bgLayer2 = document.getElementById('bg-layer-2');
            let currentLayer = bgLayer1;
            let nextLayer = bgLayer2;

            loadNextImage(bgLayer1).then(() => {
                bgLayer1.style.opacity = '1';
                bgLayer1.classList.add('bg-current');
                setTimeout(startRotation, 5000);
            }).catch(err => {
                console.error('首张背景加载失败', err);
                setTimeout(() => location.reload(), 3000);
            });

            function startRotation() {
                loadNextImage(nextLayer).then(() => {
                    nextLayer.classList.remove('bg-next');
                    nextLayer.classList.add('bg-current');
                    nextLayer.style.opacity = '1';

                    currentLayer.classList.remove('bg-current');
                    currentLayer.classList.add('bg-next');
                    currentLayer.style.opacity = '0';

                    const temp = currentLayer;
                    currentLayer = nextLayer;
                    nextLayer = temp;

                    setTimeout(startRotation, 5000);
                }).catch(err => {
                    console.error('背景加载失败，跳过本次切换', err);
                    setTimeout(startRotation, 3000);
                });
            }

            function loadNextImage(layerElement) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const url = `https://bing.img.run/rand_uhd.php?t=${Date.now()}`;

                    img.onload = () => {
                        layerElement.style.backgroundImage = `url('${url}')`;
                        resolve();
                    };

                    img.onerror = () => {
                        reject('Image load failed: ' + url);
                    };

                    img.src = url;
                });
            }

            // 加载群聊数据
            loadGroups();

            function loadGroups() {
                const container = document.getElementById('groups-container');
                const loading = document.getElementById('loading');

                fetch(API_URL)
                    .then(response => response.json())
                    .then(data => {
                        loading.remove();

                        if (data.code !== 200 || !data.data || data.data.length === 0) {
                            showEmptyState();
                            return;
                        }

                        // 显示全局通知（如果有）
                        if (data.notification) {
                            const waitTime = data.close_wait_time || 0;
                            const buttonText = data.close_button_text || '我知道了';
                            showNotification(data.notification, waitTime, buttonText);
                        }

                        // 从API返回中获取群信息API URL（api.php在上级目录）
                        if (data.api_url) {
                            const baseUrl = data.api_url.replace(/\/$/, '').replace(/^http:/, 'https:');
                            GROUP_INFO_API_URL = baseUrl + '/api.php';
                            console.log('群信息API URL:', GROUP_INFO_API_URL);
                        }

                        data.data.forEach(group => {
                            const card = createGroupCard(group);
                            container.appendChild(card);
                        });
                    })
                    .catch(err => {
                        console.error('加载群聊数据失败:', err);
                        loading.innerHTML = `
                            <div class="empty-state text-white">
                                <i class="bi bi-exclamation-triangle display-1 mb-3 d-block opacity-50"></i>
                                <p class="fs-5">加载失败，请稍后重试</p>
                            </div>
                        `;
                    });
            }

            function showEmptyState() {
                const container = document.getElementById('groups-container');
                container.innerHTML = `
                    <div class="empty-state text-white">
                        <i class="bi bi-people display-1 mb-3 d-block opacity-25"></i>
                        <p class="fs-5">暂无QQ群聊</p>
                    </div>
                `;
            }

            function createGroupCard(group) {
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4';

                col.innerHTML = `
                    <div class="qq-group-card position-relative">
                        <!-- 加载动画 -->
                        <div class="loading-overlay position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background: inherit; z-index: 2;">
                            <div class="spinner-border text-white" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <div class="card-body d-flex flex-column p-4 position-relative" style="z-index: 1;">
                            <div class="mb-3 d-flex align-items-center">
                                <img src="https://q2.qlogo.cn/headimg_dl?dst_uin=0&spec=100" class="rounded-circle me-3 group-avatar bg-white p-1" style="width: 48px; height: 48px; object-fit: cover; opacity: 0;">
                                <div class="flex-grow-1">
                                    <h5 class="fw-bold text-white mb-1 group-name">${escapeHtml(group.name)}</h5>
                                    <div class="group-info-row">
                                        <span class="group-id-display">群号: 解析中...</span>
                                        <button class="copy-group-btn" disabled>复制</button>
                                    </div>
                                </div>
                            </div>

                            ${group.description ? `<p class="card-text text-white-50 mb-3 small line-clamp-3 group-desc">${escapeHtml(group.description)}</p>` : ''}

                            <div class="mb-3 group-tags">
                                <span class="badge bg-white bg-opacity-10 text-white border border-white border-opacity-25 me-1 mb-1 group-member-count">
                                    <i class="bi bi-person-fill me-1"></i>0 / ${group.max_members || 200}
                                </span>
                            </div>
                            <div class="mb-3 group-tags-container" style="display: none;"></div>

                            <div class="mt-auto pt-3 border-top border-white border-opacity-10 d-flex justify-content-between align-items-center">
                                <button class="group-link-btn text-decoration-none fw-bold text-white d-flex align-items-center"
                                        style="font-size: 0.9rem; background: none; border: none; padding: 0; cursor: pointer; outline: none; user-select: none;"
                                        data-group-url="${escapeHtml(group.link)}">
                                    加入群组 <i class="bi bi-arrow-right ms-1"></i>
                                </button>
                                <small class="text-white-50 group-create-time" style="font-size: 0.8rem;"></small>
                            </div>
                        </div>
                        <!-- 隐藏的iframe用于PC端加群 -->
                        <iframe class="group-join-iframe" style="display:none;" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe>
                    </div>
                `;

                // 绑定加入群组按钮事件
                const joinBtn = col.querySelector('.group-link-btn');
                if (joinBtn) {
                    joinBtn.addEventListener('click', function() {
                        const groupUrl = this.getAttribute('data-group-url');
                        const iframe = col.querySelector('.group-join-iframe');

                        if (groupUrl) {
                            // 检测是否为移动设备
                            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

                            if (isMobile) {
                                // 手机版直接跳转
                                window.location.href = groupUrl;
                                console.log('移动设备，直接跳转:', groupUrl);
                            } else {
                                // PC版使用隐藏iframe
                                if (iframe) {
                                    iframe.src = groupUrl;
                                    console.log('PC设备，通过隐藏iframe加载:', groupUrl);
                                }
                            }
                        } else {
                            alert('未找到加群链接！');
                        }
                    });
                }

                // 通过API查询群详细信息
                loadGroupDetail(col, group);

                return col;
            }

            function loadGroupDetail(col, group) {
                if (!group.link) {
                    hideLoading(col);
                    return;
                }

                const apiUrl = `${GROUP_INFO_API_URL}?url=${encodeURIComponent(group.link)}`;

                fetch(apiUrl)
                    .then(response => response.json())
                    .then(data => {
                        const loading = col.querySelector('.loading-overlay');
                        const avatar = col.querySelector('.group-avatar');
                        const nameEl = col.querySelector('.group-name');
                        const idEl = col.querySelector('.group-id-display');
                        const descEl = col.querySelector('.group-desc');
                        const memberCountEl = col.querySelector('.group-member-count');
                        const timeEl = col.querySelector('.group-create-time');
                        const copyBtn = col.querySelector('.copy-group-btn');
                        const linkBtn = col.querySelector('.group-link-btn');

                        // 移除加载动画
                        if (loading) {
                            loading.style.opacity = '0';
                            setTimeout(() => loading.remove(), 300);
                        }

                        if (data.success && data.info) {
                            const info = data.info;

                            // 更新头像
                            if (info.avatar) {
                                avatar.src = info.avatar;
                                avatar.style.opacity = '1';
                            } else {
                                avatar.style.opacity = '1';
                            }

                            // 更新群名
                            if (info.name) {
                                nameEl.textContent = info.name;
                            }

                            // 更新群号
                            if (info.groupCode) {
                                idEl.textContent = '群号: ' + info.groupCode;
                                if (copyBtn) {
                                    copyBtn.disabled = false;
                                    copyBtn.title = '复制群号';
                                    copyBtn.onclick = () => copyToClipboard(info.groupCode, copyBtn);
                                }
                            }

                            // 更新描述
                            if (info.description) {
                                descEl.textContent = info.description;
                            }

                            // 更新成员数
                            if (info.memberCount) {
                                memberCountEl.innerHTML = `<i class="bi bi-person-fill me-1"></i>${info.memberCount} / ${group.max_members || 200}`;
                            }

                            // 更新创建时间
                            if (info.createTime) {
                                timeEl.textContent = '建群时间: ' + info.createTime.split(' ')[0];
                            }

                            // 更新标签
                            if (info.tags && Array.isArray(info.tags) && info.tags.length > 0) {
                                const tagsContainer = col.querySelector('.group-tags-container');
                                if (tagsContainer) {
                                    tagsContainer.innerHTML = '';
                                    tagsContainer.style.display = 'block';
                                    info.tags.forEach(tag => {
                                        const tagBadge = document.createElement('span');
                                        tagBadge.className = 'badge bg-white bg-opacity-10 text-white border border-white border-opacity-25 me-1 mb-1';
                                        tagBadge.textContent = tag;
                                        tagsContainer.appendChild(tagBadge);
                                    });
                                }
                            }
                        } else {
                            // API解析失败，使用默认数据
                            avatar.style.opacity = '1';
                            idEl.textContent = '群号: 未知';
                            if (copyBtn) {
                                copyBtn.disabled = true;
                            }
                            const now = new Date();
                            timeEl.textContent = '建群时间: ' + `${now.getFullYear()}年${now.getMonth()+1}月`;
                        }
                    })
                    .catch(err => {
                        console.error('获取群详情失败:', err);
                        hideLoading(col);
                        const avatar = col.querySelector('.group-avatar');
                        if (avatar) avatar.style.opacity = '1';
                    });
            }

            function hideLoading(col) {
                const loading = col.querySelector('.loading-overlay');
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.remove(), 300);
                }
            }

            function copyToClipboard(text, btn) {
                navigator.clipboard.writeText(text).then(() => {
                    const originalText = btn.textContent;
                    btn.textContent = '已复制';
                    btn.classList.add('btn-success');
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.classList.remove('btn-success');
                    }, 2000);
                }).catch(err => {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        });
    </script>
</body>
</html>
