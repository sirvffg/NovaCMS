<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Monitor 示例</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 28px; margin-bottom: 20px; }
        .card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .card p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }

        .message { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
        .message.error { display: block; background: #fde8e8; color: #c0392b; border: 1px solid #f5c6c6; }
        .message.success { display: block; background: #e8f8e8; color: #27ae60; border: 1px solid #c6f5c6; }
        .message.info { display: block; background: #e8f0fe; color: #2c6fdb; border: 1px solid #c6d9f5; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: border-color .2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #4f6ef7; box-shadow: 0 0 0 3px rgba(79,110,247,0.12); }

        .btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, opacity .2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #4f6ef7; color: #fff; }
        .btn-primary:hover { background: #3d5bd9; }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .btn-danger-sm { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; padding: 5px 12px; font-size: 13px; }
        .btn-danger-sm:hover { background: #fecaca; }
        .btn-outline { background: #fff; color: #666; border: 1px solid #ddd; }
        .btn-outline:hover { background: #f5f5f5; }
        .btn-sm { padding: 6px 14px; font-size: 13px; }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .response-box { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 14px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; margin-top: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; display: none; }
        .response-box.show { display: block; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }
        .checkbox-group label { font-size: 14px; color: #666; margin: 0; cursor: pointer; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .user-badge { font-size: 13px; color: #666; display: flex; align-items: center; gap: 8px; }
        .role-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .role-tag.admin { background: #fef3c7; color: #d97706; }
        .role-tag.user { background: #dbeafe; color: #2563eb; }

        .footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 20px; padding-bottom: 20px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 12px; padding: 28px; width: 90%; max-width: 420px; margin: 20px; }

        /* Overview */
        .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #f8f9fa; border-radius: 10px; padding: 16px; text-align: center; border: 1px solid #eee; }
        .stat-card .num { font-size: 28px; font-weight: 700; line-height: 1.2; }
        .stat-card .label { font-size: 12px; color: #999; margin-top: 4px; }
        .stat-card.online .num { color: #10b981; }
        .stat-card.offline .num { color: #ef4444; }
        .stat-card.total .num { color: #4f6ef7; }
        .stat-card.latency .num { color: #f59e0b; font-size: 20px; }

        /* Monitor list */
        .monitor-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 10px; transition: box-shadow .2s; }
        .monitor-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .monitor-item .info { display: flex; align-items: center; gap: 12px; flex:1; }
        .monitor-item .info .name { font-weight: 600; font-size: 14px; }
        .monitor-item .info .url { font-size: 12px; color: #999; }
        .monitor-item .status { display: flex; align-items: center; gap: 16px; }
        .monitor-item .status .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .monitor-item .status .dot.online { background: #10b981; }
        .monitor-item .status .dot.offline { background: #ef4444; }
        .monitor-item .status .dot.pending { background: #d1d5db; animation: pulse 1s infinite; }
        .monitor-item .latency { font-size: 13px; font-weight: 600; min-width: 50px; text-align: right; }
        .monitor-item .latency.fast { color: #10b981; }
        .monitor-item .latency.medium { color: #f59e0b; }
        .monitor-item .latency.slow { color: #ef4444; }
        .monitor-item .location-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #f3f4f6; color: #666; font-weight: 600; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Bar -->
        <div class="card" style="padding:16px 24px;">
            <div class="top-bar">
                <div style="display:flex;align-items:center;gap:10px;">
                    <strong style="font-size:16px;">📡 服务监控</strong>
                    <span id="updateTime" style="font-size:12px;color:#999;"></span>
                </div>
                <div class="user-badge">
                    <span id="loginStatus"><button class="btn btn-outline btn-sm" onclick="showLogin()">登录</button></span>
                </div>
            </div>
        </div>

        <!-- Overview -->
        <div class="card">
            <div class="overview-grid" id="overviewGrid">
                <div class="stat-card total"><div class="num" id="ovTotal">-</div><div class="label">监控总数</div></div>
                <div class="stat-card online"><div class="num" id="ovOnline">-</div><div class="label">运行正常</div></div>
                <div class="stat-card offline"><div class="num" id="ovOffline">-</div><div class="label">服务异常</div></div>
                <div class="stat-card latency"><div class="num" id="ovLatency">-</div><div class="label">响应耗时(ms)</div></div>
            </div>

            <div id="monitorList"><div class="empty-state"><span class="icon">⏳</span><p>正在检测...</p></div></div>
            <div id="listResponse" class="response-box"></div>
        </div>

        <!-- Admin actions -->
        <div id="adminBar" class="card" style="padding:16px 24px;display:none;">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-primary btn-sm" onclick="showAddMonitor()">+ 添加监控</button>
                <button class="btn btn-outline btn-sm" onclick="fetchMonitors()">刷新</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal" onclick="if(event.target===this)hideLogin()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 style="margin-bottom:16px;">登录</h3>
            <div id="msgLogin" class="message"></div>
            <div class="form-group">
                <label>用户名 / 邮箱</label>
                <input type="text" id="username" placeholder="管理员或用户账号" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="输入密码" autocomplete="current-password">
            </div>
            <div class="checkbox-group" style="margin-bottom:16px;">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">记住我</label>
            </div>
            <div id="verifyArea" style="display:none;">
                <div class="form-group">
                    <label>邮箱验证码（已发送至 <strong id="emailHint"></strong>）</label>
                    <input type="text" id="code" placeholder="6 位数字" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                </div>
            </div>
            <button class="btn btn-primary" id="btnLogin" onclick="handleLogin()" style="width:100%;justify-content:center;">登录</button>
            <button class="btn btn-outline" style="margin-top:8px;width:100%;justify-content:center;" onclick="hideLogin()">取消</button>
            <div id="authResponse" class="response-box" style="margin-top:12px;"></div>
        </div>
    </div>

    <!-- Add Monitor Modal -->
    <div class="modal-overlay" id="addModal" onclick="if(event.target===this)hideAddMonitor()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 style="margin-bottom:16px;">添加监控项</h3>
            <div id="msgAdd" class="message"></div>
            <div class="form-group">
                <label>名称 <span style="color:#e74c3c;">*</span></label>
                <input type="text" id="addName" placeholder="如：GitHub">
            </div>
            <div class="form-group">
                <label>URL <span style="color:#e74c3c;">*</span></label>
                <input type="url" id="addUrl" placeholder="https://github.com">
            </div>
            <div class="form-group">
                <label>地区</label>
                <select id="addLocation">
                    <option value="CN">CN (中国)</option>
                    <option value="US">US (美国)</option>
                    <option value="HK">HK (香港)</option>
                    <option value="JP">JP (日本)</option>
                    <option value="SG">SG (新加坡)</option>
                    <option value="KR">KR (韩国)</option>
                    <option value="DE">DE (德国)</option>
                    <option value="GB">GB (英国)</option>
                </select>
            </div>
            <div class="form-group">
                <label>类型</label>
                <select id="addType">
                    <option value="Web">Web</option>
                    <option value="API">API</option>
                    <option value="Server">Server</option>
                </select>
            </div>
            <div class="form-group">
                <label>排序</label>
                <input type="number" id="addSort" value="0">
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn btn-outline btn-sm" onclick="hideAddMonitor()">取消</button>
                <button class="btn btn-primary btn-sm" id="btnAdd" onclick="handleAddMonitor()">添加</button>
            </div>
            <div id="addResponse" class="response-box"></div>
        </div>
    </div>

    <div class="footer">Nova JSON API Demo · GET 公开，写入需管理员权限 · 自动 30s 刷新</div>

    <script>
        // ---------- State ----------
        let sessionToken = '';
        let userRole = '';
        let userName = '';
        let loginUsername = '';
        let pollTimer = null;
        const API_MONITOR = '/nova-json/v1/statuses/monitor';
        const API_AUTH = '/nova-json/v1/auth';

        // ---------- UI ----------
        function showMsg(id, t, c) { const e=document.getElementById(id); e.textContent=t; e.className='message '+c; }
        function hideMsg(id) { document.getElementById(id).className='message'; }
        function showResponse(id, d) { const e=document.getElementById(id); e.textContent=JSON.stringify(d,null,2); e.classList.add('show'); }
        function hideResponse(id) { document.getElementById(id).classList.remove('show'); }
        function escapeHtml(s) { if(typeof s!=='string')return s; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
        function setLoading(bid, l) { const b=document.getElementById(bid); b.disabled=l; b.innerHTML=l?'<span class="spinner"></span>处理中...':b.dataset.text; }

        // ---------- Login Modal ----------
        function showLogin() { document.getElementById('loginModal').classList.add('show'); hideMsg('msgLogin'); hideResponse('authResponse'); document.getElementById('verifyArea').style.display='none'; document.getElementById('btnLogin').dataset.text='登录'; document.getElementById('btnLogin').innerHTML='登录'; }
        function hideLogin() { document.getElementById('loginModal').classList.remove('show'); }

        // ---------- Update UI by Role ----------
        function updateUI() {
            const s=document.getElementById('loginStatus');
            const a=document.getElementById('adminBar');
            if (sessionToken && userRole) {
                const r=userRole==='admin'?'<span class="role-tag admin">管理员</span>':'<span class="role-tag user">用户</span>';
                s.innerHTML=r+' '+escapeHtml(userName)+' <button class="btn btn-outline" style="padding:3px 10px;font-size:12px;color:#dc2626;" onclick="handleLogout()">退出</button>';
                a.style.display=userRole==='admin'?'block':'none';
            } else {
                s.innerHTML='<button class="btn btn-outline btn-sm" onclick="showLogin()">登录</button>';
                a.style.display='none';
            }
        }

        // ---------- Login ----------
        async function handleLogin() {
            const u=document.getElementById('username').value.trim(), p=document.getElementById('password').value;
            if(!u||!p){showMsg('msgLogin','请输入账号和密码','error');return;}
            const va=document.getElementById('verifyArea'), c=document.getElementById('code').value.trim();
            hideMsg('msgLogin'); setLoading('btnLogin',true);
            try {
                if(va.style.display==='block'&&c){
                    const r=await fetch(API_AUTH+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUsername,code:c,remember_me:document.getElementById('rememberMe').checked})});
                    const d=await r.json(); showResponse('authResponse',d);
                    if(d.code!=='rest_ok'){showMsg('msgLogin',d.message||'验证失败','error');setLoading('btnLogin',false);return;}
                    sessionToken=d.data.token;userRole=(d.data.user?d.data.user.role:null)||'user';userName=(d.data.user?d.data.user.username:null)||u;
                    if(document.getElementById('rememberMe').checked)localStorage.setItem('nova_token',sessionToken);else localStorage.removeItem('nova_token');
                    hideLogin();updateUI();
                } else {
                    const r=await fetch(API_AUTH+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
                    const d=await r.json(); showResponse('authResponse',d);
                    if(d.code!=='rest_ok'){showMsg('msgLogin',d.message||'登录失败','error');setLoading('btnLogin',false);return;}
                    if(d.data.requires_verification){
                        loginUsername=u;document.getElementById('emailHint').textContent=d.data.email_hint;
                        va.style.display='block';document.getElementById('code').focus();
                        document.getElementById('btnLogin').dataset.text='验证';document.getElementById('btnLogin').innerHTML='验证';
                        setLoading('btnLogin',false);return;
                    }
                    sessionToken=d.data.token;userRole=(d.data.user?d.data.user.role:null)||'user';userName=(d.data.user?d.data.user.username:null)||u;
                    if(document.getElementById('rememberMe').checked)localStorage.setItem('nova_token',sessionToken);else localStorage.removeItem('nova_token');
                    hideLogin();updateUI();
                }
            } catch(e){showMsg('msgLogin','网络错误: '+e.message,'error');}
            setLoading('btnLogin',false);
        }

        async function handleLogout(){
            try{await fetch(API_AUTH+'/logout',{method:'POST',headers:sessionToken?{'Authorization':'Bearer '+sessionToken}:{}});}catch(_){}
            localStorage.removeItem('nova_token');sessionToken='';userRole='';userName='';updateUI();
        }

        // ---------- Fetch ----------
        async function fetchMonitors() {
            const listEl=document.getElementById('monitorList');
            listEl.innerHTML='<div class="empty-state"><span class="icon">⏳</span><p>正在检测...</p></div>';
            hideResponse('listResponse');

            try {
                const res=await fetch(API_MONITOR,{headers:sessionToken?{'Authorization':'Bearer '+sessionToken}:{}});
                const d=await res.json(); showResponse('listResponse',d);
                if(d.code!=='rest_ok'){listEl.innerHTML='<div class="empty-state"><span class="icon">⚠️</span><p>'+(d.message||'获取失败')+'</p></div>';return;}

                const dt=d.data;
                document.getElementById('ovTotal').textContent=dt.total;
                document.getElementById('ovOnline').textContent=dt.online_count;
                document.getElementById('ovOffline').textContent=dt.offline_count;
                document.getElementById('ovLatency').textContent=dt.response_time;

                // Monitor items
                const items=dt.items||[];
                if(items.length===0){
                    listEl.innerHTML='<div class="empty-state"><span class="icon">📡</span><p>暂无监控项</p></div>';
                    return;
                }

                document.getElementById('updateTime').textContent = '更新: '+new Date().toLocaleTimeString();

                let html='';
                items.forEach(function(it){
                    const dotClass=it.online?'online':'offline';
                    const statusText=it.online?'正常':'离线';
                    const latency=it.latency||'-';
                    const latClass=it.online?(latency<150?'fast':latency<400?'medium':'slow'):'';
                    const latDisplay=it.online?latency+'ms':'<span style="color:#999;">Timeout</span>';
                    const delBtn=(userRole==='admin')
                        ?' <button class="btn btn-danger-sm" style="padding:2px 8px;font-size:11px;" onclick="deleteMonitor('+it.id+')">删除</button>'
                        :'';
                    // 非管理员不返回 url
                    var urlDisplay = it.url ? escapeHtml(it.url) : '<span style="color:#ccc">***</span>';
                    html+=
                        '<div class="monitor-item">'+
                            '<div class="info">'+
                                '<span class="location-badge">'+escapeHtml(it.location||'CN')+'</span>'+
                                '<div><div class="name">'+escapeHtml(it.name)+delBtn+'</div><div class="url">'+urlDisplay+'</div></div>'+
                            '</div>'+
                            '<div class="status">'+
                                '<span class="latency '+latClass+'">'+latDisplay+'</span>'+
                                '<span><span class="dot '+dotClass+'"></span> '+statusText+'</span>'+
                            '</div>'+
                        '</div>';
                });
                listEl.innerHTML=html;
            } catch(e){
                document.getElementById('monitorList').innerHTML='<div class="empty-state"><span class="icon">⚠️</span><p>网络错误: '+escapeHtml(e.message)+'</p></div>';
            }
        }

        // ---------- Add Monitor ----------
        function showAddMonitor(){document.getElementById('addModal').classList.add('show');document.getElementById('addName').value='';document.getElementById('addUrl').value='';document.getElementById('addSort').value='0';hideMsg('msgAdd');hideResponse('addResponse');}
        function hideAddMonitor(){document.getElementById('addModal').classList.remove('show');}

        async function handleAddMonitor(){
            const name=document.getElementById('addName').value.trim(), url=document.getElementById('addUrl').value.trim();
            if(!name){showMsg('msgAdd','名称不能为空','error');return;}
            if(!url){showMsg('msgAdd','URL 不能为空','error');return;}
            hideMsg('msgAdd');hideResponse('addResponse');setLoading('btnAdd',true);
            try{
                const res=await fetch(API_MONITOR,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionToken},body:JSON.stringify({name,url,location:document.getElementById('addLocation').value,type:document.getElementById('addType').value,sort_order:document.getElementById('addSort').value})});
                const d=await res.json();showResponse('addResponse',d);
                if(d.code==='rest_ok'){showMsg('msgAdd','✅ 已添加: '+escapeHtml(name),'success');hideAddMonitor();fetchMonitors();}else{showMsg('msgAdd','❌ '+(d.message||'添加失败'),'error');}
            }catch(e){showMsg('msgAdd','网络错误: '+e.message,'error');}
            setLoading('btnAdd',false);
        }

        // ---------- Delete Monitor ----------
        async function deleteMonitor(id){
            if(!confirm('确定删除此监控项吗？ID 会重排。')) return;
            try{
                const res=await fetch(API_MONITOR+'/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+sessionToken}});
                const d=await res.json();showResponse('listResponse',d);
                if(d.code==='rest_ok'){fetchMonitors();}else{alert(d.message||'删除失败');}
            }catch(e){alert('网络错误: '+e.message);}
        }

        // ---------- Init ----------
        (function init(){
            document.querySelectorAll('.btn').forEach(b=>{if(!b.dataset.text)b.dataset.text=b.innerHTML;});
            document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});
            document.getElementById('code').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});

            const token=localStorage.getItem('nova_token');
            if(token){
                (async function(){
                    try{
                        const r=await fetch(API_AUTH+'/me',{headers:{'Authorization':'Bearer '+token}});
                        const d=await r.json();
                        if(d.code==='rest_ok'){sessionToken=token;userRole=(d.data.user?d.data.user.role:null)||'user';userName=(d.data.user?d.data.user.username:null)||'';updateUI();}
                    }catch(_){}
                    fetchMonitors();
                })();
            } else { fetchMonitors(); }

            // Poll every 30s
            pollTimer=setInterval(fetchMonitors,30000);
        })();
    </script>
</body>
</html>
